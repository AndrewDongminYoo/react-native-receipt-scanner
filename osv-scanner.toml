reason = "deepmerge@4.3.1 via jest-config@30.5.2 (jest 30.5.2) and @react-native-community/cli@20.2.0 (the example app's development CLI, through cli-config and cli-doctor) has no patched release as of 2026-11-05: the advisory lists no first_patched_version for >= 4.2.0, <= 4.3.1, and 4.3.1 is the latest published version (npm view deepmerge version), itself affected. Low severity, prototype poisoning through mergeObject(). No first-party source imports deepmerge; every path in the lockfile ends at a devDependency, and whether jest-config or the CLI passes untrusted input to the affected function was not verified. Approved on 2026-11-05. Re-evaluate when deepmerge publishes a patched release or when jest-config and @react-native-community/cli drop it."
