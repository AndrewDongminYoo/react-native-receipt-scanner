name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt-core:
    name: Receipt Core (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [release, sanitizers]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify source snapshot
        run: python3 cpp/receipt_core/vendor.py --check --upstream-check
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure core
        env:
          CC: clang
          CXX: clang++
          CORE_MODE: ${{ matrix.mode }}
        run: |
          if [ "$CORE_MODE" = sanitizers ]; then
            cmake -S cpp/overlap_pilot/tests -B /tmp/receipt-core -D RECEIPT_CORE_SANITIZERS=ON -D BUILD_SHARED_LIBS=ON
          else
            cmake -S cpp/overlap_pilot/tests -B /tmp/receipt-core -D CMAKE_BUILD_TYPE=Release
          fi
      - name: Build core
        run: cmake --build /tmp/receipt-core --parallel 2
      - name: Test core
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir /tmp/receipt-core --output-on-failure
      - name: Test pilot host parity
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: node pilot/host-parity.js /tmp/receipt-core/receipt_transport_driver

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: yarn npm audit --environment production
