name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: read-all

jobs:
  build-library:
    name: Build Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  publish-npm:
    name: Publish to npm
    needs: build-library
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # OIDC trusted publishing (configured on npmjs.com; no NPM_TOKEN secret)
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # Configures .npmrc for registry.npmjs.org so npm's OIDC trusted
          # publishing has a registry to authenticate against. Without this the
          # publish fails with ENEEDAUTH (no NODE_AUTH_TOKEN, no OIDC exchange).
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; use the Node version in .nvmrc.
      # It also turns provenance on by default, which is what we want now that
      # the source repo is public — sigstore attestations need a public repo, and
      # that was the only reason NPM_CONFIG_PROVENANCE was previously forced off.
      # Do not re-add that override unless this repo goes private again.
      - name: Publish to npm
        run: npm publish

  # The native builds live in their own workflows so pull requests and manual
  # runs can trigger them too; a release still builds both through workflow_call.
  build-android:
    name: Build Android
    uses: ./.github/workflows/native-android.yml

  build-ios:
    name: Build iOS
    uses: ./.github/workflows/native-ios.yml

  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build example for Web
        run: |
          yarn example build:web
