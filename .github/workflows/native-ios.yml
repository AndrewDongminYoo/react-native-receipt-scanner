name: Native iOS Example Build

on:
  workflow_dispatch:
  # release.yml calls this, so a release still builds the example app.
  workflow_call:
  pull_request:
    branches:
      - main
    # Deliberately an ignore list, not an allow list. Too many things reach a
    # native build indirectly — codegen reads src, autolinking reads
    # react-native.config.js, the setup action installs from yarn.lock — and a
    # path missing from an allow list skips the job silently, which looks
    # identical to a pass. A path missing from an ignore list only costs one
    # redundant build.
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - src/__tests__/**
      - .github/workflows/ci.yml
  # Matches ci.yml. Merge groups do not honour paths-ignore, so this runs
  # unconditionally once a merge queue is enabled.
  merge_group:
    types:
      - checks_requested

# A literal group name, not github.workflow: under workflow_call that
# resolves to the caller ("Release"), so the Android and iOS builds of one
# release would share a group and cancel each other.
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Set build number
        run: |
          echo "BUILD_NUMBER=$(TZ='Asia/Seoul' date +'%y%m%d%H')" >> "$GITHUB_ENV"

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="$TURBO_CACHE_DIR" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache cocoapods
        if: env.turbo_cache_hit != 1
        id: cocoapods-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            example/ios/Pods
            example/ios/build/rncore-facades
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('example/ios/Podfile', 'example/ios/Podfile.lock', 'example/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="$TURBO_CACHE_DIR"
