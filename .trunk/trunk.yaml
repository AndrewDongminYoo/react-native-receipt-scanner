# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: quality-configs
      ref: v0.5.0
      uri: https://github.com/AndrewDongminYoo/quality-configs
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - java@13.0.11
    - node@22.22.3
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - dotenv-linter
    - oxipng
    - svgo
  ignore:
    - linters: [cspell, shellcheck, shfmt]
      paths:
        - android/gradlew
        - example/android/gradlew
    - linters: [dotenv-linter]
      paths:
        - ios/.xcode.env
        - ios/.xcode.env.local
    - linters: [osv-scanner]
      paths:
        - "**/Podfile.lock"
    - linters: [shellcheck, shfmt]
      paths: [example/android/gradlew]
    - linters: [osv-scanner, trufflehog]
      paths: [example/ios/Podfile.lock]
    - linters: [markdownlint]
      paths: [.github/**/*.md]
  enabled:
    - trivy@0.71.0
    - pinact@4.1.0
    - taplo@0.10.0
    - osv-scanner@2.4.0
    - actionlint@1.7.12
    - checkov@3.3.15
    - eslint@10.9.1
    - git-diff-check
    - ktlint@1.8.0
    - markdownlint@0.49.1
    - prettier@3.9.6
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - trufflehog@3.95.8
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-fmt-pre-commit
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-upgrade-available
