# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - java@13.0.11
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - dotenv-linter
  ignore:
    - linters: [shellcheck]
      paths: [example/android/gradlew]
    - linters: [osv-scanner]
      paths: [example/ios/Podfile.lock]
    - linters: [markdownlint]
      paths: [.github/**/*.md]
  enabled:
    - pinact@4.0.0
    - taplo@0.10.0
    - grype@0.112.0
    - osv-scanner@2.3.8
    - actionlint@1.7.12
    - checkov@3.3.8
    # Pinned to 9.x: `@react-native` eslint config pulls @babel/eslint-parser,
    # whose eslint-scope@5 ScopeManager has no addGlobals() — eslint 10 crashes
    # on every plain .js file. Bumping package.json's eslint is NOT the unblock:
    # that chain already wants eslint ^8.57.0 (see the YN0060 peer warning on
    # install), so the gate is upstream @react-native/eslint-config, not us.
    - eslint@9.39.4
    - git-diff-check
    - ktlint@1.8.0
    - markdownlint@0.49.1
    - oxipng@10.1.1
    - prettier@3.9.6
    - shellcheck@0.11.0
    # Pinned to 3.6.0: 3.13.1 reindents every shell file (incl. the vendored
    # gradlew) from .editorconfig's 2 spaces to tabs. Verified by running
    # `trunk fmt` on generate-info-plist.sh under each version.
    - shfmt@3.6.0
    - trufflehog@3.95.3
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
