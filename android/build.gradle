buildscript {
  ext.ReceiptScanner = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ReceiptScanner[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.3"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.receiptscanner"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // ML Kit Document Scanner (camera capture + auto-crop; in-camera gallery import disabled)
  implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"

  // ML Kit Text Recognition — Korean model covers Korean + Latin characters.
  // ROTATION-INVARIANCE GUARD: OcrProcessor's single-pass rotation routing
  // assumes ML Kit Korean returns identical results regardless of input
  // rotation. This was field-validated on 16.0.0 only; 16.0.1 is one patch
  // ahead. Before bumping further, re-verify invariance on a real device
  // (identical lineCount/lineAspect/textLength at 0/90/180/270) per the
  // procedure in docs/notes/ml-kit-korean-rotation-invariance.md.
  implementation "com.google.mlkit:text-recognition-korean:16.0.1"
  implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
  implementation "com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1"
  implementation "com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1"
  implementation "com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1"

  // EXIF metadata read/write
  implementation "androidx.exifinterface:exifinterface:1.4.2"

  // Activity Result API for the Android gallery picker flow
  implementation "androidx.activity:activity-ktx:1.10.1"

  // Unit tests
  testImplementation "junit:junit:4.13.2"
}
