# OSV-Scanner config for the example app's Ruby (CocoaPods/fastlane) toolchain.
# Trunk scans subdirectory lockfiles with a working directory that doesn't resolve
# the repo-root .trunk/configs/osv-scanner.toml, so concurrent-ruby ignores live
# here, adjacent to Gemfile.lock, where osv-scanner auto-discovers them.
#
# concurrent-ruby 1.3.3 — three concurrency-correctness advisories (AtomicReference
# livelock on NaN, ReadWriteLock / ReentrantReadWriteLock edge cases). Patched in
# 1.3.7, but the Gemfile pins `concurrent-ruby < 1.3.4` (standard React Native
# template constraint: 1.3.4 dropped the implicit `logger` require and breaks
# CocoaPods). Example-app build tooling only — never shipped in the published
# package. Revisit when the example drops the pin.
[[IgnoredVulns]]
id = "GHSA-h8w8-99g7-qmvj"
ignoreUntil = 2026-12-31
reason = "concurrent-ruby 1.3.3, example-app CocoaPods tooling only (not shipped); pinned < 1.3.4 by the RN template Gemfile. Patch is 1.3.7 — revisit when the example drops the pin."

